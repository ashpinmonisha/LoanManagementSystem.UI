<main class="auth-page">
  <section class="auth-card">
    <a class="back-link" routerLink="/login">← Employee portal</a>
    <span class="eyebrow">CUSTOMER PORTAL</span>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage your profile, KYC documents and financial details.</p>

    @if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    }

    <form #loginForm="ngForm" (ngSubmit)="submit()">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />

      <button class="primary-button" type="submit" [disabled]="loading || !loginForm.valid">
        {{ loading ? 'Signing in…' : 'Sign in to your account' }}
      </button>
    </form>

    <p class="switch-auth">
      New to LoanSphere? <a routerLink="/customer/register">Create an account</a>
    </p>
  </section>
</main>
